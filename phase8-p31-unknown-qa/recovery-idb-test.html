<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase 8 隔離DB復旧テスト</title></head><body><h1>Phase 8｜隔離DB復旧テスト</h1><p>このページは独立した一時IndexedDBだけを使います。本番・既存の検証DBは開きません。P31本体の復旧コードを直接実行する試験ではありません。</p><button id="run">隔離テストを実行</button><pre id="output">未実施</pre><script src="recovery-idb-integration-test.js"></script><script>document.getElementById('run').addEventListener('click',async()=>{const b=document.getElementById('run');b.disabled=true;try{const r=await JuglogRecoveryIdbProbe.run();document.getElementById('output').textContent=r.map(x=>(x.ok?'合格':'不合格')+' '+x.name+(x.details?' : '+x.details:'')).join('\n')}finally{b.disabled=false}});</script></body></html>
